<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>0% to 100% Loading</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url(https://static.vecteezy.com/system/resources/thumbnails/041/038/335/small_2x/ai-generated-beautiful-sunset-over-the-lake-with-tree-silhouette-natural-background-photo.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
            color: #fff;
        }
        
        #loader {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #percentage {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .bar-container {
            width: 300px;
            height: 20px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .bar {
            height: 100%;
            width: 100%;
            background: #03f90c;
            transition: width 0.1s linear;
        }
        
        #content {
            display: none;
            justify-content: center;
            text-align: center;
            padding: 40px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: large;
        }
        
        .page {
            display: flex;
            justify-content: center;
            text-align: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: large;
        }
    </style>
</head>

<body>

    <div id="loader">
        <div id="percentage">0%</div>
        <div class="bar-container">
            <div class="bar" id="bar"></div>
        </div>
    </div>

    <div class="page" id="content">
        <h1>Welcome!</h1>

    </div>

    <script>
        let count = 0;
        const percentage = document.getElementById('percentage');
        const bar = document.getElementById('bar');

        const interval = setInterval(() => {
            count++;
            percentage.textContent = count + '%';
            bar.style.width = count + '%';

            if (count >= 100) {
                clearInterval(interval);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }
        }, 30);
    </script>

</body>

</html>
